name: lint-vault

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: {}

jobs:
  lint_vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@v4
        with:
          ref: vault
          path: vault_repo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml requests --quiet

      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! python3 src/check_frontmatter.py vault_repo/01_Assessments; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_OWNER_ID}" \
              -d text="lint_vault: обнаружен невалидный frontmatter в 01_Assessments/, pipeline ${PIPELINE_URL}"
            exit 1
          fi
