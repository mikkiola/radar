image: python:3.12

stages:
  - run
  - publish
  - collect
  - patterns
  - pages

radar:
  stage: run
  script:
    - pip install requests anthropic ghapi pyyaml --quiet
    - git config --global user.email "radar@gitlab.com"
    - git config --global user.name "Radar Bot"
    - git clone --branch vault https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lyolich777ka/radar.git vault_repo
    - VAULT_PATH="$(pwd)/vault_repo/01_Assessments" PATTERNS_PATH="$(pwd)/vault_repo/02_Patterns" python3 src/analyze.py
    - VAULT_PATH="$(pwd)/vault_repo/01_Assessments" python3 src/update_assessments.py
    - cd vault_repo
    - git remote set-url origin https://lyolich777ka:${GITLAB_PUSH_TOKEN}@gitlab.com/lyolich777ka/radar.git
    - git add -A
    - python3 ../src/check_frontmatter.py 01_Assessments || exit 1
    - |
      if git diff --staged --quiet; then
        echo "Новых оценок нет — нечего пушить"
      else
        git commit -m "Радар $(date '+%Y-%m-%d') — новые оценки"
        git pull --rebase origin vault
        python3 ../src/check_frontmatter.py 01_Assessments || exit 1
        git push origin vault
        echo "Оценки запушены в ветку vault"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PUBLISH_ONLY != "true" && $PATTERN_MODE != "weekly" && $LIFECYCLE_ONLY != "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $PUBLISH_ONLY != "true" && $PATTERN_MODE != "weekly" && $LIFECYCLE_ONLY != "true"'

confirm_candidate:
  stage: run
  script:
    - pip install requests pyyaml --quiet
    - git config --global user.email "radar@gitlab.com"
    - git config --global user.name "Radar Bot"
    - git clone --branch vault https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lyolich777ka/radar.git vault_repo
    - VAULT_PATH="$(pwd)/vault_repo/01_Assessments" python3 src/confirm_candidate.py
    - cd vault_repo
    - git remote set-url origin https://lyolich777ka:${GITLAB_PUSH_TOKEN}@gitlab.com/lyolich777ka/radar.git
    - git add -A
    - 'git commit -m "HITL-подтверждение $CONFIRM_REPO: $CONFIRM_DECISION"'
    - git pull --rebase origin vault
    - python3 ../src/check_frontmatter.py 01_Assessments || exit 1
    - git push origin vault
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CONFIRM_REPO'

promote_candidates:
  stage: run
  script:
    - pip install requests pyyaml ghapi --quiet
    - git config --global user.email "radar@gitlab.com"
    - git config --global user.name "Radar Bot"
    - git clone --branch vault https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lyolich777ka/radar.git vault_repo
    - VAULT_PATH="$(pwd)/vault_repo/01_Assessments" python3 src/promote_candidates.py
    - cd vault_repo
    - git remote set-url origin https://lyolich777ka:${GITLAB_PUSH_TOKEN}@gitlab.com/lyolich777ka/radar.git
    - git add -A
    - |
      if git diff --staged --quiet; then
        echo "Нет CANDIDATE-файлов для обработки"
      else
        git commit -m "Карантин: promote_candidates $(date '+%Y-%m-%d')"
        git pull --rebase origin vault
        python3 ../src/check_frontmatter.py 01_Assessments || exit 1
        git push origin vault
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $LIFECYCLE_ONLY != "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $PROMOTE_ONLY == "true"'

recheck_lifecycle:
  stage: run
  script:
    - pip install requests pyyaml ghapi --quiet
    - git config --global user.email "radar@gitlab.com"
    - git config --global user.name "Radar Bot"
    - git clone --branch vault https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lyolich777ka/radar.git vault_repo
    - VAULT_PATH="$(pwd)/vault_repo/01_Assessments" python3 src/recheck_lifecycle.py
    - cd vault_repo
    - git remote set-url origin https://lyolich777ka:${GITLAB_PUSH_TOKEN}@gitlab.com/lyolich777ka/radar.git
    - git add -A
    - |
      if git diff --staged --quiet; then
        echo "Нет изменений lifecycle-сигналов"
      else
        git commit -m "Переоценка lifecycle: recheck_lifecycle $(date '+%Y-%m-%d')"
        git pull --rebase origin vault
        python3 ../src/check_frontmatter.py 01_Assessments || exit 1
        git push origin vault
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $LIFECYCLE_ONLY == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $LIFECYCLE_ONLY == "true"'

publish:
  stage: publish
  script:
    - pip install requests anthropic pyyaml --quiet
    - git config --global user.email "radar@gitlab.com"
    - git config --global user.name "Radar Bot"
    - git clone --branch vault https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lyolich777ka/radar.git vault_repo
    - mkdir -p vault_repo/99_System
    - VAULT_PATH="$(pwd)/vault_repo/01_Assessments" PUBLISHED_LOG="$(pwd)/vault_repo/99_System/published_posts.log" python3 src/telegram_post.py
    - cd vault_repo
    - git remote set-url origin https://lyolich777ka:${GITLAB_PUSH_TOKEN}@gitlab.com/lyolich777ka/radar.git
    - git add -A
    - |
      if git diff --staged --quiet; then
        echo "Лог не изменился"
      else
        git commit -m "Опубликован пост $(date '+%Y-%m-%d %H:%M')"
        git pull --rebase origin vault
        python3 ../src/check_frontmatter.py 01_Assessments || exit 1
        git push origin vault
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PUBLISH_ONLY == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $PUBLISH_ONLY == "true"'

analysts:
  stage: collect
  script:
    - pip install requests anthropic pyyaml --quiet
    - git config --global user.email "radar@gitlab.com"
    - git config --global user.name "Radar Bot"
    - git clone --branch vault https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lyolich777ka/radar.git vault_repo
    - python3 src/fetch_analysts.py --vault vault_repo
    - cd vault_repo
    - git remote set-url origin https://lyolich777ka:${GITLAB_PUSH_TOKEN}@gitlab.com/lyolich777ka/radar.git
    - git add -A
    - git diff --cached --quiet || (git commit -m "Аналитик Builder Radar $(date '+%Y-%m-%d')" && git pull --rebase origin vault && python3 ../src/check_frontmatter.py 01_Assessments && git push origin vault)
  rules:
    - if: '$PATTERN_MODE == "weekly"'

lint_vault:
  stage: run
  script:
    - pip install pyyaml requests --quiet
    - git clone --branch vault https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lyolich777ka/radar.git vault_repo
    - |
      if ! python3 src/check_frontmatter.py vault_repo/01_Assessments; then
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_OWNER_ID}" \
          -d text="lint_vault: обнаружен невалидный frontmatter в 01_Assessments/, pipeline ${CI_PIPELINE_URL}"
        exit 1
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

check_models:
  stage: collect
  script:
    - pip install requests anthropic pyyaml --quiet
    - git config --global user.email "radar@gitlab.com"
    - git config --global user.name "Radar Bot"
    - git clone --branch vault https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lyolich777ka/radar.git vault_repo
    - VAULT_PATH="$(pwd)/vault_repo" python3 src/check_model_updates.py
    - cd vault_repo
    - git remote set-url origin https://lyolich777ka:${GITLAB_PUSH_TOKEN}@gitlab.com/lyolich777ka/radar.git
    - git add -A
    - git diff --cached --quiet || (git commit -m "Проверка модели $(date '+%Y-%m-%d')" && git pull --rebase origin vault && python3 ../src/check_frontmatter.py 01_Assessments && git push origin vault)
  rules:
    - if: '$PATTERN_MODE == "weekly"'

patterns:
  stage: patterns
  script:
    - pip install requests anthropic pyyaml --quiet
    - git config --global user.email "radar@gitlab.com"
    - git config --global user.name "Radar Bot"
    - git clone --branch vault https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lyolich777ka/radar.git vault_repo
    - VAULT_PATH="$(pwd)/vault_repo" python3 src/patterns.py
    - cd vault_repo
    - git remote set-url origin https://lyolich777ka:${GITLAB_PUSH_TOKEN}@gitlab.com/lyolich777ka/radar.git
    - git add -A
    - |
      if git diff --staged --quiet; then
        echo "Паттерны не изменились"
      else
        git commit -m "Паттерны $(date '+%Y-%m-%d') — обновление"
        git pull --rebase origin vault
        python3 ../src/check_frontmatter.py 01_Assessments || exit 1
        git push origin vault
        echo "Паттерны запушены в ветку vault"
      fi
  rules:
    - if: '$PATTERN_MODE == "weekly"'

pages:
  stage: pages
  image: python:3.12
  variables:
    GIT_STRATEGY: none
  script:
    - git clone --branch master https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lyolich777ka/radar.git .
    - pip install -r requirements_pages.txt --quiet
    - git clone --branch vault https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lyolich777ka/radar.git vault_content
    - mkdir -p docs/01_Assessments docs/02_Patterns docs/assets/javascripts docs/assets/stylesheets
    - cp -r vault_content/01_Assessments/. docs/01_Assessments/
    - cp -r vault_content/02_Patterns/. docs/02_Patterns/
    - python3 src/generate_indexes.py
    - python3 src/generate_graph.py
    - mkdocs build --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == "vault" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $GRAPH_ONLY == "true"'
  cache:
    key: pip-mkdocs
    paths:
      - ~/.cache/pip/
