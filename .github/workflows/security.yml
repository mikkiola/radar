name: security

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: {}

jobs:
  security_secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout vault for scanning
        uses: actions/checkout@v4
        with:
          ref: vault
          path: vault_repo

      - name: Download and verify betterleaks
        run: |
          curl -sL -o betterleaks.tar.gz https://github.com/betterleaks/betterleaks/releases/download/v1.7.3/betterleaks_1.7.3_linux_x64.tar.gz
          echo "9d2ed6fc387bc1c3f95557d5539077b1ce422f0db5ec38db5f14a141ad2947bf  betterleaks.tar.gz" | sha256sum -c -
          tar -xzf betterleaks.tar.gz betterleaks
          chmod +x betterleaks

      - name: Scan main
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! ./betterleaks git . --no-banner; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_OWNER_ID}" \
              -d text="security_secrets: Betterleaks нашёл потенциальный секрет в main, pipeline ${PIPELINE_URL}"
            exit 1
          fi

      - name: Scan vault
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! ./betterleaks git vault_repo --no-banner; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_OWNER_ID}" \
              -d text="security_secrets: Betterleaks нашёл потенциальный секрет в vault, pipeline ${PIPELINE_URL}"
            exit 1
          fi

  security_deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip-audit
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pip install pip-audit --quiet
          if ! pip-audit -r requirements-security.txt; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_OWNER_ID}" \
              -d text="security_deps: pip-audit нашёл уязвимость в зависимостях, pipeline ${PIPELINE_URL}"
            exit 1
          fi
