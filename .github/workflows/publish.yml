name: publish

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@v4
        with:
          ref: vault
          path: vault_repo
          token: ${{ secrets.GH_VAULT_PUSH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: |
          pip install requests anthropic pyyaml --quiet
          mkdir -p vault_repo/99_System

      - env:
          VAULT_ROOT: ${{ github.workspace }}/vault_repo
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python3 src/telegram_post.py

      - uses: ./.github/actions/vault-write
        with:
          commit-message: "Опубликован пост $(date '+%Y-%m-%d %H:%M')"
          no-op-message: "Лог не изменился"
