image: python:3.11

stages:
  - run
  - publish
  - patterns
  - pages

radar:
  stage: run
  script:
    - pip install requests anthropic --quiet
    - git config --global user.email "radar@gitlab.com"
    - git config --global user.name "Radar Bot"
    - git clone --branch vault https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lyolich777ka/opensource-radar.git vault_repo
    - VAULT_PATH="$(pwd)/vault_repo/01_Assessments" PATTERNS_PATH="$(pwd)/vault_repo/02_Patterns" python3 analyze.py
    - VAULT_PATH="$(pwd)/vault_repo/01_Assessments" python3 update_assessments.py
    - cd vault_repo
    - git remote set-url origin https://lyolich777ka:${GITLAB_PUSH_TOKEN}@gitlab.com/lyolich777ka/opensource-radar.git
    - git add -A
    - |
      if git diff --staged --quiet; then
        echo "Новых оценок нет — нечего пушить"
      else
        git commit -m "Радар $(date '+%Y-%m-%d') — новые оценки"
        git pull --rebase origin vault
        git push origin vault
        echo "Оценки запушены в ветку vault"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PUBLISH_ONLY != "true" && $PATTERN_MODE != "weekly"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $PUBLISH_ONLY != "true" && $PATTERN_MODE != "weekly"'

publish:
  stage: publish
  script:
    - pip install requests anthropic --quiet
    - git config --global user.email "radar@gitlab.com"
    - git config --global user.name "Radar Bot"
    - git clone --branch vault https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lyolich777ka/opensource-radar.git vault_repo
    - mkdir -p vault_repo/99_System
    - VAULT_PATH="$(pwd)/vault_repo/01_Assessments" PUBLISHED_LOG="$(pwd)/vault_repo/99_System/published_posts.log" python3 telegram_post.py
    - cd vault_repo
    - git remote set-url origin https://lyolich777ka:${GITLAB_PUSH_TOKEN}@gitlab.com/lyolich777ka/opensource-radar.git
    - git add -A
    - |
      if git diff --staged --quiet; then
        echo "Лог не изменился"
      else
        git commit -m "Опубликован пост $(date '+%Y-%m-%d %H:%M')"
        git pull --rebase origin vault
        git push origin vault
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PUBLISH_ONLY == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $PUBLISH_ONLY == "true"'

patterns:
  stage: patterns
  script:
    - pip install requests anthropic --quiet
    - git config --global user.email "radar@gitlab.com"
    - git config --global user.name "Radar Bot"
    - git clone --branch vault https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lyolich777ka/opensource-radar.git vault_repo
    - VAULT_PATH="$(pwd)/vault_repo" python3 patterns.py
    - cd vault_repo
    - git remote set-url origin https://lyolich777ka:${GITLAB_PUSH_TOKEN}@gitlab.com/lyolich777ka/opensource-radar.git
    - git add -A
    - |
      if git diff --staged --quiet; then
        echo "Паттерны не изменились"
      else
        git commit -m "Паттерны $(date '+%Y-%m-%d') — обновление"
        git pull --rebase origin vault
        git push origin vault
        echo "Паттерны запушены в ветку vault"
      fi
  rules:
    - if: '$PATTERN_MODE == "weekly"'

pages:
  stage: pages
  image: python:3.11
  script:
    - pip install -r requirements_pages.txt --quiet
    - git clone --branch vault https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lyolich777ka/opensource-radar.git vault_content
    - mkdir -p docs/01_Assessments docs/02_Patterns docs/assets/javascripts docs/assets/stylesheets
    - cp -r vault_content/01_Assessments/. docs/01_Assessments/
    - cp -r vault_content/02_Patterns/. docs/02_Patterns/
    - curl -fsSL "https://daxcore.github.io/mkdocs-obsidian-interactive-graph-plugin/assets/javascripts/interactive_graph.js" -o docs/assets/javascripts/interactive_graph.js
    - curl -fsSL "https://daxcore.github.io/mkdocs-obsidian-interactive-graph-plugin/assets/stylesheets/interactive_graph.css" -o docs/assets/stylesheets/interactive_graph.css
    - mkdocs build --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $GRAPH_ONLY == "true"'
  cache:
    key: pip-mkdocs
    paths:
      - ~/.cache/pip/
