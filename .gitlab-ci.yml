image: python:3.11

stages:
  - run

radar:
  stage: run
  script:
    # Установка зависимостей
    - pip install requests anthropic --quiet

    # Настройка git
    - git config --global user.email "radar@gitlab.com"
    - git config --global user.name "Radar Bot"

    # Клонируем ветку vault в папку vault/
    - git clone --branch vault https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lyolich777ka/opensource-radar.git vault_repo

    # Запускаем радар — собираем проекты
    - python3 radar_step0.py > /tmp/radar_output.txt 2>&1 || true
    - cat /tmp/radar_output.txt

    # Анализируем через Claude — сохраняем в vault_repo/01_Assessments/
    - VAULT_PATH="$(pwd)/vault_repo/01_Assessments" python3 analyze.py
    - VAULT_PATH="$(pwd)/vault_repo/01_Assessments" python3 update_assessments.py

    # Пушим новые оценки в ветку vault
    - cd vault_repo
    - git add -A
    - |
      if git diff --staged --quiet; then
        echo "Новых оценок нет — нечего пушить"
      else
        git commit -m "Радар $(date '+%Y-%m-%d') — новые оценки"
        git push origin vault
        echo "Оценки запушены в ветку vault"
      fi

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

  variables:
    ANTHROPIC_API_KEY: $ANTHROPIC_API_KEY
    TELEGRAM_BOT_TOKEN: $TELEGRAM_BOT_TOKEN
    TELEGRAM_CHANNEL_ID: $TELEGRAM_CHANNEL_ID
    TELEGRAM_OWNER_ID: $TELEGRAM_OWNER_ID